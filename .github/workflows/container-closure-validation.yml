name: Contributor container closure validation
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact contribution source commit
        required: true
        type: string
      full_stack:
        description: Run the real large-profile launcher in an isolated Linux VM
        type: boolean
        default: false
      full_public:
        description: Validate the complete sanitized public candidate
        type: boolean
        default: false
      build_images:
        description: Build, smoke-test and scan both native image architectures
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - name: Verify exact source
        env:
          SOURCE_REVISION: ${{ inputs.revision }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
      - run: npm ci --no-audit --no-fund
      - name: Runtime closure and distribution regression tests
        run: node --test scripts/tests/container-runtime.test.mjs scripts/tests/container-smoke.test.mjs scripts/tests/container-image-size-budget.test.mjs scripts/tests/public-docker-distribution.test.mjs scripts/tests/public-workflows.test.mjs scripts/tests/public-export.test.mjs
      - run: npm run check
      - run: npm run build
      - run: npm run hygiene:preflight
      - name: Prepare real Linux runtime trees
        run: |
          for target in core browser cli; do
            node scripts/container-runtime.mjs "$target" "$RUNNER_TEMP/runtime-$target"
            du -sm "$RUNNER_TEMP/runtime-$target"
            node -e 'const r=require(process.argv[1]); console.log(JSON.stringify(r))' "$RUNNER_TEMP/runtime-$target/container-runtime.json"
          done
      - name: Check service boundaries and load native runtime modules
        run: |
          test ! -e "$RUNNER_TEMP/runtime-core/node_modules/node-pty"
          test ! -e "$RUNNER_TEMP/runtime-browser/node_modules/node-pty"
          test ! -e "$RUNNER_TEMP/runtime-browser/node_modules/@temporalio"
          test ! -e "$RUNNER_TEMP/runtime-browser/node_modules/pdfjs-dist"
          test ! -e "$RUNNER_TEMP/runtime-cli/apps/api"
          test ! -e "$RUNNER_TEMP/runtime-cli/node_modules/@temporalio"
          test ! -e "$RUNNER_TEMP/runtime-cli/node_modules/pdfjs-dist"
          cd "$RUNNER_TEMP/runtime-core"
          node --input-type=module -e 'await import("@space/cli-host/client"); await import("@temporalio/worker"); await import("@space/db")'
          cd "$RUNNER_TEMP/runtime-browser"
          node --input-type=module -e 'await import("@space/browser-host"); await import("@space/db")'
          cd "$RUNNER_TEMP/runtime-cli"
          node --input-type=module -e 'await import("@space/cli-host")'
  images:
    needs: runtime
    if: inputs.build_images || inputs.full_stack
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - name: Verify exact source and record actual runner resources
        env:
          SOURCE_REVISION: ${{ inputs.revision }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          nproc
          free -m
          df -h "$RUNNER_TEMP"
          ls -l /dev/kvm || true
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Build every image, measure and run the real service on this native architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          failures=0
          for target in core browser cli; do
            echo "::group::Build $target / $ARCH"
            docker buildx build --platform "linux/$ARCH" --target "$target" --tag "spaceapp-ci:$target-$ARCH" --load --provenance=false --progress=plain .
            echo "::endgroup::"
            if ! node scripts/container-image-size-budget.mjs --target "$target" --image "spaceapp-ci:$target-$ARCH"; then failures=1; fi
            if ! node scripts/container-smoke.mjs --target "$target" --image "spaceapp-ci:$target-$ARCH"; then failures=1; fi
          done
          exit "$failures"
      - name: Scan core image with the upstream blocking policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: spaceapp-ci:core-${{ matrix.arch }}
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          cache: false
      - name: Scan browser image with the upstream blocking policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: spaceapp-ci:browser-${{ matrix.arch }}
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          cache: false
      - name: Scan CLI image with the upstream blocking policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: spaceapp-ci:cli-${{ matrix.arch }}
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          cache: false
      - name: Load immutable verification tools from fork main
        if: inputs.full_stack && matrix.arch == 'amd64'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: casperhenriksson-sudo/spaceapp
          ref: 6772c5e18dc4e883b0c9088d3e930d6663f73ec1
          path: _verification-tools
          persist-credentials: false
      - name: Real Linux large-profile install, owner setup, CLI, browser and cleanup
        if: inputs.full_stack && matrix.arch == 'amd64'
        run: bash _verification-tools/.github/verification/container-stack-vm.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/_verification-tools/.github/verification"
  public-quality:
    if: inputs.full_public
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - name: Verify exact source
        env:
          SOURCE_REVISION: ${{ inputs.revision }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
      - name: Record upstream export provenance separately from validation
        run: |
          if node scripts/verify-export-provenance.mjs .; then
            echo 'Upstream export provenance passed.'
          else
            echo 'Advisory only: issue 64 documents the outside-contributor provenance limitation. The upstream gate is unchanged.'
          fi
      - name: Export the public candidate and preserve the reviewed packaging helpers
        run: |
          node scripts/public-export.mjs --output "$RUNNER_TEMP/spaceapp-public-export"
          for file in scripts/container-runtime.mjs scripts/container-smoke.mjs scripts/tests/container-runtime.test.mjs scripts/tests/container-smoke.test.mjs; do
            cmp "$file" "$RUNNER_TEMP/spaceapp-public-export/$file"
          done
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep ffmpeg
      - run: npm ci --no-audit --no-fund
        working-directory: ${{ runner.temp }}/spaceapp-public-export
      - run: npm audit --audit-level=high
        working-directory: ${{ runner.temp }}/spaceapp-public-export
      - run: npm run test:public
        working-directory: ${{ runner.temp }}/spaceapp-public-export
      - run: npm run check
        working-directory: ${{ runner.temp }}/spaceapp-public-export
      - run: npm run build
        working-directory: ${{ runner.temp }}/spaceapp-public-export
      - run: npm run pack:dry-run -w run-spaceapp
        working-directory: ${{ runner.temp }}/spaceapp-public-export
