name: Contributor container closure validation
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact contribution source commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - name: Verify exact source
        env:
          SOURCE_REVISION: ${{ inputs.revision }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
      - run: npm ci --no-audit --no-fund
      - name: Runtime closure and distribution regression tests
        run: node --test scripts/tests/container-runtime.test.mjs scripts/tests/container-image-size-budget.test.mjs scripts/tests/public-docker-distribution.test.mjs
      - run: npm run check
      - run: npm run build
      - name: Prepare real Linux runtime trees
        run: |
          for target in core browser cli; do
            node scripts/container-runtime.mjs "$target" "$RUNNER_TEMP/runtime-$target"
            du -sm "$RUNNER_TEMP/runtime-$target"
            node -e 'const r=require(process.argv[1]); console.log(JSON.stringify(r))' "$RUNNER_TEMP/runtime-$target/container-runtime.json"
          done
      - name: Check service boundaries and load native runtime modules
        run: |
          test ! -e "$RUNNER_TEMP/runtime-core/node_modules/node-pty"
          test ! -e "$RUNNER_TEMP/runtime-browser/node_modules/node-pty"
          test ! -e "$RUNNER_TEMP/runtime-browser/node_modules/@temporalio"
          test ! -e "$RUNNER_TEMP/runtime-browser/node_modules/pdfjs-dist"
          test ! -e "$RUNNER_TEMP/runtime-cli/apps/api"
          test ! -e "$RUNNER_TEMP/runtime-cli/node_modules/@temporalio"
          test ! -e "$RUNNER_TEMP/runtime-cli/node_modules/pdfjs-dist"
          cd "$RUNNER_TEMP/runtime-core"
          node --input-type=module -e 'await import("@space/cli-host/client"); await import("@temporalio/worker"); await import("@space/db")'
          cd "$RUNNER_TEMP/runtime-browser"
          node --input-type=module -e 'await import("@space/browser-host"); await import("@space/db")'
          cd "$RUNNER_TEMP/runtime-cli"
          node --input-type=module -e 'await import("@space/cli-host")'
