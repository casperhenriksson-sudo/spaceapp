name: Disposable runner prerequisite diagnostic
on:
  workflow_dispatch:
permissions: {}
jobs:
  prerequisites:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect standard runner tools and public package sources
        run: |
          for tool in rg ffmpeg qemu-system-x86_64 qemu-img cloud-localds; do
            command -v "$tool" || true
          done
          cat /etc/os-release
          grep -hE '^(URIs|Suites|Components):|^deb ' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          apt-cache policy ripgrep ffmpeg qemu-system-x86 cloud-image-utils
      - name: Bound an actual Ubuntu package-index request
        run: |
          set +e
          sudo timeout --kill-after=5s 90s apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 update
          result=$?
          printf 'Package-index exit status: %s\n' "$result"
          exit "$result"
      - name: Verify complete unattended proof-tool installation
        run: |
          sudo timeout --kill-after=10s 300s env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Dpkg::Use-Pty=0 install -y --no-install-recommends ripgrep ffmpeg qemu-system-x86 qemu-utils cloud-image-utils
          command -v rg ffmpeg qemu-system-x86_64 qemu-img cloud-localds
          rg --version
          ffmpeg -version
          qemu-system-x86_64 --version
