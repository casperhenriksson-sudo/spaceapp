name: Contributor workflow tracing validation
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact contribution source commit
        required: true
        type: string
permissions:
  contents: read
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  SOURCE_REVISION: ${{ inputs.revision }}
jobs:
  source-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: npm
      - name: Verify exact revision and supported runtime
        run: |
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          node --version
          uname -a
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep ffmpeg
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Strictly typecheck tracing tests and local proof source
        run: >-
          npm exec -w @space/worker -- tsc --noEmit --target ES2023
          --module NodeNext --moduleResolution NodeNext --skipLibCheck
          --esModuleInterop --strict --types node
          tests/trace-propagation.test.ts tests/workflow-tracing.integration.test.ts
          scripts/otlp-trace-proof.ts
      - run: npm test
      - run: npm run build
      - run: npm run hygiene:preflight
  public-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: npm
      - name: Verify exact source
        run: |
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
      - name: Record upstream provenance result (outside PR exception in issue 61)
        run: |
          if node scripts/verify-export-provenance.mjs .; then
            echo 'Upstream provenance passed.'
          else
            echo 'Outside contribution: issue 61 explicitly excludes this provenance failure; the upstream gate is unchanged.'
          fi
      - name: Create the same sanitized public candidate as upstream CI
        run: node scripts/public-export.mjs --output "$RUNNER_TEMP/spaceapp-public-export"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep ffmpeg
      - run: npm ci --no-audit --no-fund
        working-directory: ${{ runner.temp }}/spaceapp-public-export
      - run: npm run test:public
        working-directory: ${{ runner.temp }}/spaceapp-public-export
      - run: npm run check
        working-directory: ${{ runner.temp }}/spaceapp-public-export
      - run: npm run build
        working-directory: ${{ runner.temp }}/spaceapp-public-export
      - run: npm run pack:dry-run -w run-spaceapp
        working-directory: ${{ runner.temp }}/spaceapp-public-export
